app = "cardflip-superior"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"

[[mounts]]
  source = "cardflip_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  # suspend resumes in ~1s; "stop" meant a ~12s cold boot for the first visitor
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

# Swap: insurance against a hard OOM kill (the seed import + Next on 512 MB
# crash-looped once, 08-16). Free; only touched under memory pressure.
swap_size_mb = 512

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
