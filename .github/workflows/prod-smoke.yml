# Production heartbeat. Runs scripts/prod-smoke.mjs against cardflip.io
# every 15 minutes, on every successful Vercel deployment, and by hand.
# A failing run emails the repository owner (GitHub's default for failed
# workflows) with the failing check in the log — the 2026-09-06 Turso quota
# block took every DB route down for ~35 minutes before anyone noticed;
# this would have said so within 15.
#
# The smoke probes need no secrets: every one is a request a stranger could
# make. Nothing is written, no account is used, eBay/Stripe are never touched.
# The ops key is used only by the mailbox check and the failure email.
name: Production smoke

on:
  schedule:
    - cron: "*/15 * * * *"
  deployment_status:
  workflow_dispatch:
    inputs:
      test_alert:
        description: "1 = send Chris a test alert email and stop (proves the GitHub → site → mail path)"
        required: false
        default: ""

concurrency:
  group: prod-smoke
  cancel-in-progress: false

# The job token only reads the repo (10-01 sweep): nothing here writes to GitHub.
permissions:
  contents: read

jobs:
  smoke:
    # deployment_status fires for every state; only a finished production
    # deploy is worth probing. Scheduled and manual runs always go.
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test alert
        if: inputs.test_alert == '1'
        env:
          KEY: ${{ secrets.OPS_KEY }}
        run: |
          curl -sS --fail --max-time 30 -X POST -H "Authorization: Bearer ${KEY}" -H "content-type: application/json" \
            -d '{"workflow":"Alert Test","message":"Test from Claude: CI and live-site failures now email you like this. Nothing is broken."}' \
            https://cardflip.io/api/ops/alert
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Vercel aliases the new deployment a few seconds after "success".
      - if: github.event_name == 'deployment_status'
        run: sleep 45
      - run: node scripts/prod-smoke.mjs https://cardflip.io
      # The mailbox that sends confirmation codes, password resets and the
      # alerts below. A dead one fails open (codes are skipped, nobody is
      # walled) and the site cannot mail anyone about it, so this asks the
      # site to log in to the SMTP server (sending nothing) and lets GitHub's
      # own failure email do the telling. Every deploy and by hand, and about
      # once an hour on the schedule (each call is a real SMTP login).
      - name: Mailbox check
        env:
          KEY: ${{ secrets.OPS_KEY }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(date -u +%M)" -ge 20 ]; then
            echo "Hourly check only; skipping this run."
            exit 0
          fi
          curl -sS --fail --max-time 30 -H "Authorization: Bearer ${KEY}" https://cardflip.io/api/ops/mail-check
      - name: Email Chris
        if: failure()
        env:
          KEY: ${{ secrets.OPS_KEY }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(jq -n --arg u "$URL" --arg s "$GITHUB_SHA" '{workflow:"Production Smoke",sha:$s,url:$u,message:"A live-site check failed. If this mail is late or missing, the site itself may be down."}')
          curl -sS --max-time 30 -X POST -H "Authorization: Bearer ${KEY}" -H "content-type: application/json" -d "$body" https://cardflip.io/api/ops/alert
