name: social-post

# Social autopilot schedule (Chris 09-25: three posts a day, 7am / 1pm / 7pm
# Eastern, hands off). 09-26: GitHub cron ran TWO HOURS late and the 7am
# post did not go out ("this cannot happen again") — the POSTS now fire from
# Vercel Cron (vercel.json → /api/social/publish, Pro plan, on the minute).
# The pings here are only a backstop: the publisher keys each slot to the
# Eastern day, so a late duplicate is a no-op.
#
# The 1pm slot goes out as a VIDEO (Chris 09-25; 09-26: the week's biggest
# movers; 09-27: moved from 7am to 1pm — VIDEO_SLOT in socialPublish.ts):
# the `video` job renders it here (headless Chromium + ffmpeg do not fit a
# Vercel function), parks it on Vercel Blob and registers it in the settings
# table; the publisher then posts the MP4 on every site that takes one,
# picture as the fallback. Since 09-30 the night render below makes
# tomorrow's 1pm video the evening before, so the `video` job's pings (from
# 10:30am Eastern, three times, so a two-hour delay still lands before 1)
# only render when that did not happen; /api/cron/social-video (Vercel,
# 12:40) dispatches a render-only run if nothing is registered by then.
#
# TikTok is NOT posted from here (Chris 09-30): its developer app was refused
# for production, so API posts would stay private, and he posts by hand. The
# `tiktok` job is the NIGHT RENDER: after the 7:05pm post it builds
# TOMORROW's three TikTok videos (7am set spotlight, the 1pm movers video, the
# 7pm all-games video) with a caption each, and /admin/social hands them over
# (lib/socialTiktok.ts). The 7am and 7pm videos are TikTok-only rows: the
# other six sites keep posting those pictures live. The pings are 8pm
# Eastern (both DST hours; the EST-side 7pm one waits, see --min-hour).
# GitHub cron can run hours late, so /api/cron/social-tiktok (Vercel, 9:15pm,
# and 5:45am for a day plan pushed overnight) dispatches this job when the
# package is incomplete or was made under a plan that has since changed.
on:
  schedule:
    - cron: "30 14 * * *" # 10:30am EDT: render the midday video
    - cron: "30 15 * * *" # 11:30am EDT / 10:30am EST
    - cron: "15 16 * * *" # 12:15pm EDT
    - cron: "30 16 * * *" # 11:30am EST
    - cron: "15 17 * * *" # 12:15pm EST
    - cron: "5 11 * * *"  # 7am EDT (backstop; Vercel posts first)
    - cron: "5 12 * * *"  # 7am EST
    - cron: "5 17 * * *"  # 1pm EDT
    - cron: "5 18 * * *"  # 1pm EST
    - cron: "5 23 * * *"  # 7pm EDT
    - cron: "5 0 * * *"   # 7pm EST
    - cron: "0 0 * * *"   # 8pm EDT: the night render, tomorrow's TikTok videos (7pm EST: waits for 8pm)
    - cron: "0 1 * * *"   # 8pm EST (9pm EDT: a re-check that finds it done)
  workflow_dispatch:
    inputs:
      render_only:
        description: "1 = render the video and stop (no post); what /api/cron/social-video sends"
        required: false
        default: ""
      slot:
        description: "morning | midday | evening (blank = by the clock)"
        required: false
        default: ""
      force:
        description: "1 = post even if this slot already went out today"
        required: false
        default: ""
      video:
        description: "1 = render the midday video first (re-renders today's)"
        required: false
        default: ""
      tiktok:
        description: "1 = build the TikTok videos and stop (no post); what /api/cron/social-tiktok sends"
        required: false
        default: ""
      tiktok_day:
        description: "YYYY-MM-DD the TikTok videos are for (blank = tomorrow, Eastern)"
        required: false
        default: ""

jobs:
  video:
    # The render pings and any dispatch that asks for it. The 1pm pings render
    # too when the earlier ones were skipped (GitHub cron is best-effort); the
    # script exits at once when today's video is already registered. Not the
    # TikTok dispatch (that is the `tiktok` job) and not the night pings.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.tiktok != '1' && (inputs.video == '1' || inputs.render_only == '1' || inputs.slot == 'midday' || inputs.slot == '')
      || contains(fromJSON('["30 14 * * *","30 15 * * *","15 16 * * *","30 16 * * *","15 17 * * *","5 17 * * *","5 18 * * *"]'), github.event.schedule)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Render, park on Blob, register
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          FORCE_RENDER: ${{ inputs.video }}
        run: |
          skip="--skip-if-done"; if [ "$FORCE_RENDER" = "1" ]; then skip=""; fi
          node --experimental-strip-types --no-warnings --conditions=react-server \
            --import ./scripts/lib/register-next-stubs.mjs scripts/social-video.mjs \
            --out midday-video.mp4 --register $skip
      - name: Keep the MP4 for a look
        if: hashFiles('midday-video.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: midday-video
          path: midday-video.mp4
          retention-days: 3

  tiktok:
    # The night render (Chris 09-30): tomorrow's three TikTok videos, one per
    # slot, each with its caption. Only slots with nothing usable registered
    # are drawn (missing, or made under a day plan that has since changed), so
    # the second ping and the safety net's dispatch are cheap when it is done.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.tiktok == '1'
      || contains(fromJSON('["0 0 * * *","0 1 * * *"]'), github.event.schedule)
    runs-on: ubuntu-latest
    # Three ~30s videos, drawn frame by frame: about 10 minutes plus setup.
    timeout-minutes: 40
    concurrency:
      group: tiktok-night-render
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Render tomorrow's three videos, park on Blob, register
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          TIKTOK_DAY: ${{ inputs.tiktok_day }}
          # Only the schedule waits for 8pm Eastern; a dispatch (the safety net, a hand run) goes now.
          EARLIEST_HOUR: ${{ github.event_name == 'schedule' && '20' || '' }}
        run: |
          day=""; if [ -n "$TIKTOK_DAY" ]; then day="--day $TIKTOK_DAY"; fi
          min=""; if [ -n "$EARLIEST_HOUR" ]; then min="--min-hour $EARLIEST_HOUR"; fi
          node --experimental-strip-types --no-warnings --conditions=react-server \
            --import ./scripts/lib/register-next-stubs.mjs scripts/social-video.mjs \
            --package --register --out-dir tiktok-videos $day $min
      - name: Keep the MP4s for a look
        if: hashFiles('tiktok-videos/*.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-videos
          path: tiktok-videos
          retention-days: 3
      - name: Tell the site the videos are built (it mails Chris once)
        if: success()
        continue-on-error: true
        env:
          KEY: ${{ secrets.SOCIAL_POST_KEY }}
          TIKTOK_DAY: ${{ inputs.tiktok_day }}
        run: |
          q="notify=1"; if [ -n "$TIKTOK_DAY" ]; then q="$q&day=$TIKTOK_DAY"; fi
          curl -sS --max-time 60 -H "Authorization: Bearer ${KEY}" "https://cardflip.io/api/cron/social-tiktok?$q"; echo
      - name: Failure alert
        if: failure()
        continue-on-error: true
        env:
          KEY: ${{ secrets.SOCIAL_POST_KEY }}
          TIKTOK_DAY: ${{ inputs.tiktok_day }}
        run: |
          q="failed=1&why=the%20night%20render%20job%20failed"; if [ -n "$TIKTOK_DAY" ]; then q="$q&day=$TIKTOK_DAY"; fi
          curl -sS --max-time 60 -H "Authorization: Bearer ${KEY}" "https://cardflip.io/api/cron/social-tiktok?$q"; echo

  post:
    needs: [video]
    # Not on the render-only pings, the night render or a render_only/tiktok dispatch; on every other ping, even when the render failed.
    if: >-
      always()
      && inputs.render_only != '1'
      && inputs.tiktok != '1'
      && !contains(fromJSON('["30 14 * * *","30 15 * * *","15 16 * * *","30 16 * * *","15 17 * * *","0 0 * * *","0 1 * * *"]'), github.event.schedule)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping the publisher
        env:
          KEY: ${{ secrets.SOCIAL_POST_KEY }}
          SLOT: ${{ inputs.slot }}
          FORCE: ${{ inputs.force }}
        run: |
          url="https://cardflip.io/api/social/publish?slot=${SLOT}&force=${FORCE}"
          code=$(curl -sS --max-time 330 -o report.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${KEY}" "$url")
          echo "HTTP $code"
          cat report.json | head -c 4000; echo
          test "$code" = "200"
