# The gate in front of main: pushing either branch (or opening a PR) runs
# types + lint + the full test aggregate. Vercel builds main regardless —
# this doesn't block the deploy, it tells us within minutes that one is bad,
# which is the whole error-budget for a solo-maintainer pipeline.
#
# No secrets on purpose: the suites run against temp-dir file databases and
# never touch Turso, eBay, Stripe, or the vision API. `next build` is left
# out — Vercel runs the real one, and duplicating it here doubles CI time
# for no signal.
name: CI

on:
  push:
    branches: [main, vercel-migration]
  pull_request:

# The job token only reads the repo (10-01 sweep): nothing here writes to GitHub.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Generates .next/types (LayoutProps etc.) that tsc needs — a fresh
      # checkout has none; locally the dev server produces them.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  # The phone pass, automated: Chromium at iPhone size against a real dev
  # server on a fresh clone (no mirror, no secrets). Layout rules on every
  # public and /app page, the tour page to page, the camera sheet with the
  # permission blocked, the editor from a ledger row. Separate job so a
  # flaky browser never blocks the unit gate above.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # A red run emails Chris (09-29: CI sat red for three hours and nobody
  # looked). The only secret in this file, and only in this step.
  alert:
    needs: [checks, e2e]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          KEY: ${{ secrets.OPS_KEY }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          body=$(jq -n --arg u "$URL" --arg s "$GITHUB_SHA" --arg m "$(printf '%s' "$MSG" | head -n1)" '{workflow:"CI",sha:$s,url:$u,message:("Commit: " + $m)}')
          curl -sS --max-time 30 -X POST -H "Authorization: Bearer ${KEY}" -H "content-type: application/json" -d "$body" https://cardflip.io/api/ops/alert
