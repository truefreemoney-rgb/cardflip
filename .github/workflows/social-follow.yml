# Outreach follows on Bluesky (10-04): card shops and vendors from
# src/data/outreach/bluesky.json, a few a day. Calls /api/ops/social-follow on
# cardflip.io (the Bluesky login only lives on Vercel).
# Run by hand:
#   gh workflow run social-follow.yml -R truefreemoney-rgb/cardflip -f max=25
#   gh workflow run social-follow.yml -R truefreemoney-rgb/cardflip -f dry_run=1
name: social-follow
on:
  schedule:
    # 3:30 PM ET daily (19:30 UTC in EDT; 2:30 PM ET in winter).
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "follows this run (1-40)"
        required: false
        default: "25"
      dry_run:
        description: "1 = list who would be followed, follow nobody"
        required: false
        default: "0"
permissions:
  contents: read
jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call social-follow
        env:
          KEY: ${{ secrets.SOCIAL_POST_KEY }}
          MAX: ${{ inputs.max || '25' }}
          DRY: ${{ inputs.dry_run || '0' }}
        run: |
          code=$(curl -sS --max-time 320 -o out.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${KEY}" "https://cardflip.io/api/ops/social-follow?max=${MAX}&dryRun=${DRY}")
          echo "HTTP $code"
          {
            echo "### social-follow - HTTP $code"
            echo '```json'
            jq . out.json 2>/dev/null || cat out.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$code" in 2*) ;; *) exit 1 ;; esac
